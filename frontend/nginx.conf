server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml model/gltf-binary;

    # 3D models and assets caching
    location ~* \.(?:glb|gltf|bin|png|jpg|jpeg|svg|webp|ico)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Vite build hashed assets (immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
